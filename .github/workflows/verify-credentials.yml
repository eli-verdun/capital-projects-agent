name: Verify credentials and agent
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_GATEWAY_API_KEY: ${{ secrets.LANGSMITH_GATEWAY_API_KEY }}
      LANGSMITH_WORKSPACE_ID: ${{ vars.LANGSMITH_WORKSPACE_ID }}
      LANGSMITH_AGENT_ID: ${{ vars.LANGSMITH_AGENT_ID || 'capital-projects-agent' }}
      LANGSMITH_AGENT_ENVIRONMENT: ${{ vars.LANGSMITH_AGENT_ENVIRONMENT || 'staging' }}
      LANGSMITH_TRACING: "true"
      LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT }}
      AGENT_MODEL: ${{ vars.AGENT_MODEL }}
      GUARDRAIL_MODEL: ${{ vars.GUARDRAIL_MODEL }}
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - name: Install locked Python dependencies
        run: uv sync --frozen
      - name: Verify real credentials and trace delivery
        run: uv run python scripts/verify_credentials.py
      - name: Verify domain integrity
        run: uv run python scripts/verify_local.py
      - name: Build operator chat
        run: npm --prefix frontend ci && npm --prefix frontend run build
      - name: Verify real graph and injection guardrail
        run: uv run python scripts/verify_agent_smoke.py
