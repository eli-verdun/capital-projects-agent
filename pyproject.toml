[project]
name = "capital-projects-agent"
version = "0.1.0"
description = "Meridian Project Delivery Advisor: capital-project delivery assistant demo for LangSmith agents, Context Hub, Insights, evals, guardrails and PII-redacted tracing"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "langgraph>=0.6.0",
    "langchain>=0.3.27",
    "langchain-core>=1.6.11",
    "langchain-openai>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langsmith>=0.14.12",
    "python-dotenv>=1.0.1",
    "langgraph-sdk>=0.1.66",
    "numpy>=1.26",
    "fastapi>=0.115",
    "deepagents>=0.6.10",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_advisor"]
